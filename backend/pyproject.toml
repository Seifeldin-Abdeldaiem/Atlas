[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: find duplicate and overlapping tasks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "PyJWT[crypto]>=2.8",
    "boto3>=1.34",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "charset-normalizer>=3.3",
    "anthropic>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
