# Render blueprint: Render -> New -> Blueprint -> pick this repository.
#
# Free-plan layout: the API container also runs migrations and the background
# worker (RUN_MIGRATIONS / RUN_WORKER_IN_API in backend/start.sh). To move to
# paid plans, set plan: starter, turn RUN_WORKER_IN_API off and add a
# background worker service running "python -m atlas.worker".
#
# Values marked sync: false are secrets: Render asks for them when the
# blueprint is created. They never go in this file.

databases:
  - name: atlas-db
    plan: free
    region: frankfurt
    databaseName: atlas
    user: atlas_owner
    postgresMajorVersion: "16"

services:
  - type: web
    name: atlas-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: DATABASE_OWNER_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DB_POOL_MAX
        value: "5"
      - key: PARSE_MEMORY_MB
        value: "450"
      - key: WEB_ORIGINS
        value: https://atlasmatch.co.uk,https://www.atlasmatch.co.uk
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://atlasmatch.co.uk,https://www.atlasmatch.co.uk
      - key: CLERK_ISSUER
        value: https://clerk.atlasmatch.co.uk
      - key: STORAGE_BUCKET
        value: atlas-uploads
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      # Optional: AI review stays off unless a key is added.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: atlas-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    domains:
      - atlasmatch.co.uk
      - www.atlasmatch.co.uk
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://atlas-api-g79j.onrender.com
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
